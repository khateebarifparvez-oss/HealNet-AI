<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- Professional HealNet AI Icon -->
    <!-- Blue Medical Gradient Background -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0F52BA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#5DADE2;stop-opacity:1" />
        </linearGradient>
        <filter id="textShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="3" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Rounded Square Background -->
    <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
    
    <!-- Medical Cross (subtle background) -->
    <g opacity="0.15">
        <rect x="235" y="128" width="42" height="256" rx="8" fill="white"/>
        <rect x="154" y="209" width="204" height="42" rx="8" fill="white"/>
    </g>
    
    <!-- Letter H (main focus) -->
    <text x="256" y="350" 
          font-family="Georgia, serif" 
          font-size="280" 
          font-weight="900" 
          fill="white" 
          text-anchor="middle" 
          filter="url(#textShadow)">H</text>
    
    <!-- AI Tech Accent - Circuit Dots -->
    <circle cx="370" cy="165" r="10" fill="white" opacity="0.5"/>
    <circle cx="395" cy="192" r="7" fill="white" opacity="0.5"/>
    <circle cx="142" cy="320" r="10" fill="white" opacity="0.5"/>
    <circle cx="117" cy="347" r="7" fill="white" opacity="0.5"/>
    
    <!-- Connection Lines -->
    <line x1="370" y1="165" x2="395" y2="192" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="142" y1="320" x2="117" y2="347" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>